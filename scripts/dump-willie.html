<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><!-- rigged 模型蒙皮烘焙查看器:动画姿态采样 + ?dump=1 导出顶点(配合 dump-willie.py;dump2glb.py 转静态 GLB) --><style>body{margin:0;background:#222}</style></head>
<body>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(700, 700);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x333333);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const dl = new THREE.DirectionalLight(0xffffff, 1.5);
dl.position.set(2, 4, -3);
scene.add(dl);

const params = new URLSearchParams(location.search);
const CLIP = params.get('clip') || 'idle_willieMickey';
const T = parseFloat(params.get('t') || '0.5');
const RAW = params.get('raw') === '1';   // 不播动画直接导原始顶点:绑定几何本身是组装好的,
                                         // 而所有剪辑都只覆盖部分骨骼(17 关节最多 13),
                                         // 未驱动的骨骼停在散件 rest 姿态 → 四肢悬空

new GLTFLoader().load('./willieMickey.glb', (gltf) => {
  const root = gltf.scene;
  scene.add(root);
  // 播放指定动画到 t
  const mixer = new THREE.AnimationMixer(root);
  const clip = gltf.animations.find(c => c.name === CLIP) || gltf.animations[0];
  if (!RAW) {
    const action = mixer.clipAction(clip);
    action.play();
    mixer.update(T);
  }
  root.updateMatrixWorld(true);
  if (params.get('dump') === '1') {
    const parts = [];
    root.traverse(o => {
      if (!o.isSkinnedMesh && !o.isMesh) return;
      const pos = o.geometry.attributes.position;
      const arr = new Float32Array(pos.count * 3);
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        if (o.isSkinnedMesh && !RAW) o.applyBoneTransform(i, v);   // 蒙皮后(网格本地空间)
        v.applyMatrix4(o.matrixWorld);                     // → 世界
        arr[i * 3] = v.x; arr[i * 3 + 1] = v.y; arr[i * 3 + 2] = v.z;
      }
      parts.push({
        verts: Array.from(arr),
        faces: o.geometry.index ? Array.from(o.geometry.index.array) : null,
        color: o.material && o.material.color ? o.material.color.getHexString() : '808080',
      });
    });
    window.__dump = JSON.stringify(parts);
  }
  root.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) {
      console.log('MESH', o.name, o.type, 'mat=', o.material && o.material.type,
        'color=', o.material && o.material.color && o.material.color.getHexString(),
        'verts=', o.geometry.attributes.position.count, 'visible=', o.visible);
      o.frustumCulled = false;
    }
  });
  // 包围盒取景
  const box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  const size = Math.max(...box.getSize(new THREE.Vector3()).toArray());
  const cam = new THREE.PerspectiveCamera(40, 1, 0.01, size * 100);
  // 面板正面 = -Z;先拍 -Z 视角
  const view = params.get('view') || 'front';
  const d = size * 1.3;
  if (view === 'front') cam.position.set(c.x, c.y + size * 0.1, c.z - d);
  else if (view === 'back') cam.position.set(c.x, c.y + size * 0.1, c.z + d);
  else cam.position.set(c.x + d * 0.7, c.y + size * 0.25, c.z - d * 0.7);
  cam.lookAt(c);
  renderer.render(scene, cam);
  window.__ready = true;
  console.log('CLIP', clip.name, 'BBOX', JSON.stringify(box), 'ANIMCOUNT', gltf.animations.length);
}, undefined, (e) => { window.__err = String(e); });
</script>
</body>
</html>
